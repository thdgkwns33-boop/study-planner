<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스터디 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1916;--text2:#6b6a64;--text3:#9e9d96;
  --accent:#2454ff;--accent-light:#e8edff;--accent-dark:#1a3ecc;
  --green:#1a7a4a;--green-light:#e6f5ed;
  --red:#c0392b;--red-light:#fcecea;
  --amber:#b45309;--amber-light:#fef3c7;
  --radius:12px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(0,0,0,0.06);--shadow-md:0 4px 24px rgba(0,0,0,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:28px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px}
.logo-text{font-size:16px;font-weight:700;letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px}
.sync-status{font-size:10px;margin-top:4px;font-family:'DM Mono',monospace}
.sync-ok{color:#1a7a4a}.sync-err{color:#c0392b}.sync-ing{color:#b45309}
.nav-section{font-size:10px;font-weight:500;color:var(--text3);padding:12px 20px 4px;letter-spacing:0.8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:400;transition:all 0.15s;border-left:3px solid transparent;margin:1px 0}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.nav-icon{font-size:15px;width:20px;text-align:center}
.main{flex:1;padding:28px 32px;max-width:1200px;overflow-x:auto}
.page{display:none}.page.active{display:block}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px;letter-spacing:0.3px}
.dday-banner-wrap{background:linear-gradient(135deg,#1a1916,#2d2c28);border-radius:var(--radius);padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:20px;color:white;box-shadow:var(--shadow-md)}
.dday-num{font-family:'DM Mono',monospace;font-size:2.6rem;font-weight:500;color:#7eb3ff;line-height:1;min-width:76px}
.dday-name{font-size:15px;font-weight:500}.dday-date{font-size:11px;color:rgba(255,255,255,0.45);margin-top:2px;font-family:'DM Mono',monospace}
.dday-progress{margin-left:auto;text-align:center}
.dday-circle{position:relative;width:50px;height:50px}.dday-circle svg{transform:rotate(-90deg)}
.dday-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:500;font-family:'DM Mono',monospace;color:white}
.dday-label{font-size:10px;color:rgba(255,255,255,0.4);margin-top:3px}
.dday-empty{background:var(--surface2);border-radius:var(--radius);padding:14px 22px;margin-bottom:14px;color:var(--text3);font-size:13px;text-align:center;border:1px dashed var(--border2)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);box-shadow:var(--shadow)}
.stat-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px}
.input-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input[type=text],input[type=date],select,textarea{padding:7px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-family:'Noto Sans KR',sans-serif;font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:border-color 0.15s}
input[type=text]{flex:1;min-width:100px}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,84,255,0.08)}
.btn{padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;transition:all 0.15s;font-weight:400}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--accent);color:white;border-color:var(--accent)}.btn-primary:hover{background:var(--accent-dark)}
.btn-success{background:var(--green);color:white;border-color:var(--green)}.btn-success:hover{background:#155a38}
.btn-danger{color:var(--red);border-color:#f5c6c2}.btn-danger:hover{background:var(--red-light)}
.btn-sm{padding:3px 9px;font-size:12px}
.badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge-high{background:var(--red-light);color:var(--red)}.badge-mid{background:var(--amber-light);color:var(--amber)}.badge-low{background:var(--green-light);color:var(--green)}
.prog-wrap{height:5px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:5px 0 12px}
.prog-fill{height:100%;border-radius:999px;background:var(--accent);transition:width 0.4s}
.todo-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.todo-item:last-child{border-bottom:none}
.todo-cb{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
.todo-text{flex:1;font-size:13px}.todo-text.done{text-decoration:line-through;color:var(--text3)}
.todo-meta{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.sub-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all 0.15s}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.week-day{background:var(--surface2);border-radius:var(--radius-sm);padding:8px 6px;min-height:80px}
.week-day.today{border:1.5px solid var(--accent);background:var(--accent-light)}
.week-day-head{font-size:10px;font-weight:500;color:var(--text3);margin-bottom:4px;text-align:center}
.week-day-head.today-h{color:var(--accent);font-weight:700}
.week-event{font-size:10px;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.study-session-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.study-session-item:last-child{border-bottom:none}
.session-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.session-name{font-size:13px;font-weight:500;white-space:nowrap}
.session-task{font-size:12px;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-time{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);white-space:nowrap}
.session-time.active{color:var(--accent);font-weight:500}
/* 타임라인 */
.tl-outer{border-radius:var(--radius);border:1px solid #dde;overflow:hidden;font-family:'DM Mono',monospace}
.tl-header-row{display:grid;grid-template-columns:32px 1fr 1px 1fr;background:#eef0f8;border-bottom:1px solid #dde}
.tl-header-cell{padding:5px 6px;font-size:10px;font-weight:600;color:#4455aa;text-align:center}
.tl-row{display:grid;grid-template-columns:32px 1fr 1px 1fr;height:26px;border-bottom:1px solid #eef}
.tl-row:last-child{border-bottom:none}
.tl-row:hover{background:#fafafe}
.tl-label{display:flex;align-items:center;justify-content:center;font-size:10px;color:#7eb3ff;background:#f8f8ff;border-right:1px solid #dde}
.tl-divider-cell{background:#dde}
.tl-area{position:relative;overflow:hidden}
.tl-block{position:absolute;top:2px;bottom:2px;border-radius:3px;min-width:4px}
/* calendar */
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;font-weight:500;color:var(--text3);margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{min-height:90px;display:flex;flex-direction:column;align-items:flex-start;padding:5px 6px;font-size:12px;border-radius:var(--radius-sm);border:1px solid var(--border);vertical-align:top}
.cal-cell.today{background:var(--accent-light);border-color:var(--accent)}
.cal-cell.today .cal-day-num{color:var(--accent);font-weight:700}
.cal-cell.has-exam{border-color:#f5c6c2}
.cal-day-num{font-size:12px;font-weight:500;margin-bottom:2px;width:100%;text-align:center}
.cal-event{font-size:9px;border-radius:3px;padding:1px 4px;margin-bottom:2px;width:100%;line-height:1.4;word-break:keep-all;overflow-wrap:break-word}
.cal-event.ev-exam{background:#fee2e2;color:#991b1b}
.cal-event.ev-study{background:#e8edff;color:#2454ff}
.cal-event.ev-todo{background:var(--surface2);color:var(--text2)}
.cal-more{font-size:9px;color:var(--text3);text-align:center;width:100%}
.bar-wrap{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:height 0.4s}
.bar-val{font-size:9px;color:var(--text2);font-family:'DM Mono',monospace}
.bar-lbl{font-size:9px;color:var(--text3);text-align:center;overflow:hidden;white-space:nowrap;max-width:100%}
.dday-chips{display:flex;flex-wrap:wrap;gap:7px}
.dday-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px}
.dday-chip-cnt{font-weight:500;color:var(--accent);font-family:'DM Mono',monospace}
.dday-chip-del{cursor:pointer;color:var(--text3);font-size:14px}.dday-chip-del:hover{color:var(--red)}
/* check table */
.subject-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.stab{padding:7px 18px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);font-size:13px;cursor:pointer;transition:all 0.15s;color:var(--text2)}
.stab:hover{background:var(--surface2)}.stab.active{background:var(--accent);color:white;border-color:var(--accent);font-weight:500}
.lecture-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
table.lt{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface)}
table.lt th{background:#f8f7f3;font-weight:500;font-size:11px;color:var(--text2);padding:7px 9px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;text-align:center;position:sticky;top:0;z-index:2}
table.lt td{padding:6px 7px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:middle;text-align:center}
table.lt td.title-cell{text-align:left;font-size:12px;line-height:1.4;min-width:180px;max-width:240px}
table.lt td.week-cell{color:var(--text3);font-size:11px;font-family:'DM Mono',monospace;white-space:nowrap}
table.lt tr:last-child td{border-bottom:none}
table.lt tr:hover td{background:#fafaf7}
table.lt tr.imp td{background:#fffbeb}
table.lt tr.imp td.title-cell{font-weight:500;color:#92400e}
.study-btn-group{display:flex;gap:2px;justify-content:center}
.sbtn{padding:2px 6px;border-radius:4px;border:1px solid var(--border2);background:transparent;font-size:10px;cursor:pointer;color:var(--text3);font-family:'Noto Sans KR',sans-serif;transition:all 0.12s;white-space:nowrap}
.sbtn:hover{background:var(--surface2)}
.sbtn.sel-강의록{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd;font-weight:500}
.sbtn.sel-필스{background:#fef9c3;color:#854d0e;border-color:#fde047;font-weight:500}
.sbtn.sel-필스제트{background:#dcfce7;color:#166534;border-color:#86efac;font-weight:500}
.ox-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border2);background:transparent;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all 0.12s;color:var(--text3)}
.ox-btn:hover{background:var(--surface2)}.ox-btn.o{background:#dcfce7;color:#166534;border-color:#86efac}
.jb-cell{display:flex;align-items:center;gap:3px;justify-content:center}
.diff-btn{padding:2px 5px;border-radius:4px;border:1px solid var(--border2);background:transparent;font-size:10px;cursor:pointer;color:var(--text3);font-family:'Noto Sans KR',sans-serif;transition:all 0.12s}
.diff-btn.sel-상{background:#fee2e2;color:#991b1b;border-color:#fca5a5;font-weight:500}
.diff-btn.sel-중{background:#fef9c3;color:#854d0e;border-color:#fde047;font-weight:500}
.diff-btn.sel-하{background:#dcfce7;color:#166534;border-color:#86efac;font-weight:500}
.prog-mini-wrap{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prog-mini-bar{flex:1;height:5px;background:var(--surface2);border-radius:999px;overflow:hidden}
.prog-mini-fill{height:100%;border-radius:999px;background:var(--accent);transition:width 0.4s}
.prog-mini-txt{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;white-space:nowrap}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px 28px;width:540px;max-width:95vw;box-shadow:var(--shadow-md);max-height:85vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:4px}
.modal p{font-size:12px;color:var(--text2);margin-bottom:16px}
textarea{width:100%;height:160px;resize:vertical;font-size:12px;font-family:'DM Mono',monospace;line-height:1.5;border-radius:var(--radius-sm)}
.empty{text-align:center;padding:18px;color:var(--text3);font-size:13px}
.page-title{font-size:19px;font-weight:700;margin-bottom:18px;letter-spacing:-0.5px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){
  .app{flex-direction:column}.sidebar{width:100%;height:auto;position:static;flex-direction:row;padding:10px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}
  .logo,.nav-section{display:none}.nav-item{border-left:none;border-bottom:3px solid transparent;padding:7px 12px;white-space:nowrap}.nav-item.active{border-left:none;border-bottom-color:var(--accent)}
  .main{padding:14px}.stat-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-text">스터디 플래너</div>
      <div class="logo-sub">study.planner</div>
      <div class="sync-status" id="sync-status">⏳ 연결 중...</div>
    </div>
    <div class="nav-section">플래너</div>
    <div class="nav-item active" onclick="go('weekly')"><span class="nav-icon">📋</span> 주간 플랜</div>
    <div class="nav-item" onclick="go('monthly')"><span class="nav-icon">📅</span> 월간 뷰</div>
    <div class="nav-item" onclick="go('stats')"><span class="nav-icon">📊</span> 통계</div>
    <div class="nav-section">강의 체크</div>
    <div class="nav-item" onclick="go('check')"><span class="nav-icon">🗂</span> 강의 체크표</div>
    <div class="nav-item" onclick="openAddSubjectModal()"><span class="nav-icon">➕</span> 과목 추가</div>
  </nav>
  <main class="main">
    <!-- 주간 -->
    <div id="page-weekly" class="page active">
      <div class="page-title">주간 플랜</div>
      <div id="dday-banner"></div>
      <div class="card"><div class="card-title">📆 이번 주 공부 일정</div><div class="week-grid" id="week-grid"></div></div>
      <div class="stat-grid" id="weekly-stats"></div>
      <div class="two-col">
        <div>
          <div class="card">
            <div class="card-title">📚 오늘의 공부</div>
            <div class="prog-wrap"><div id="study-prog-fill" class="prog-fill" style="width:0%"></div></div>
            <div id="study-session-list"></div>
            <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="subject-pill-selector"></div>
              <div class="input-row">
                <input type="date" id="study-date">
                <input type="text" id="study-task-input" placeholder="예: 1~5강 정리, 족보 풀기..." onkeydown="if(event.key==='Enter')addStudySession()">
                <button class="btn btn-primary" onclick="addStudySession()">추가</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">✅ 오늘의 할 일</div>
            <div class="prog-wrap"><div id="todo-prog-fill" class="prog-fill" style="width:0%"></div></div>
            <div id="todo-list"></div>
            <div class="input-row">
              <input type="text" id="todo-input" placeholder="할 일 입력" onkeydown="if(event.key==='Enter')addTodo()">
              <select id="todo-prio"><option>높음</option><option selected>보통</option><option>낮음</option></select>
              <input type="date" id="todo-date">
              <button class="btn btn-primary" onclick="addTodo()">추가</button>
            </div>
          </div>
        </div>
        <div>
          <div class="card" style="padding:14px 16px">
            <div class="card-title">🕐 오늘의 타임라인</div>
            <div class="tl-outer" id="timeline-wrap"></div>
          </div>
          <div class="card">
            <div class="card-title">⏱ 과목별 타이머</div>
            <div id="subject-timer-list"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 월간 -->
    <div id="page-monthly" class="page">
      <div class="page-title" id="cal-title">월간 뷰</div>
      <div class="card">
        <div class="cal-header"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="card"><div class="card-title">📋 전체 미완료 할 일</div><div id="all-todo-list"></div></div>
    </div>
    <!-- 통계 -->
    <div id="page-stats" class="page">
      <div class="page-title">학습 통계</div>
      <div class="stat-grid" id="stats-grid"></div>
      <div class="two-col">
        <div class="card"><div class="card-title">📈 주간 과목별 공부 시간</div><div id="bar-chart"></div></div>
        <div class="card">
          <div class="card-title">📆 시험 D-day 관리</div>
          <div id="exam-list"></div>
          <div class="input-row">
            <input type="text" id="exam-input" placeholder="시험 이름">
            <input type="date" id="exam-date">
            <button class="btn btn-primary" onclick="addExam()">추가</button>
          </div>
        </div>
      </div>
    </div>
    <!-- 강의 체크표 -->
    <div id="page-check" class="page">
      <div class="page-title">강의 체크표</div>
      <div class="subject-tabs" id="check-tabs"></div>
      <div id="check-progress"></div>
      <div id="check-table"></div>
    </div>
  </main>
</div>

<!-- 과목 추가 모달 -->
<div class="modal-bg" id="add-subject-modal">
  <div class="modal">
    <h2>📋 새 과목 추가</h2>
    <p>탭 또는 2칸 이상 공백으로 구분해서 붙여넣어 주세요.<br>
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">주차 | 날짜 | 번호 | 강의명 | 교수 | 시수</span></p>
    <div style="margin-bottom:10px"><label style="font-size:12px;font-weight:500;display:block;margin-bottom:4px">과목 이름</label>

// ── 유틸 ──
function todayStr(){
  const now=new Date();
  // 05시 기준: 00~04시는 전날로 간주
  if(now.getHours()<5)now.setDate(now.getDate()-1);
  return now.toISOString().slice(0,10).replace(/T.*/,'').split('T')[0];
}
function todayStrRaw(){
  // 실제 날짜 (타임라인용)
  return new Date().toISOString().slice(0,10);
}
function diffDays(d){return Math.ceil((new Date(d)-new Date(todayStr()))/86400e3)}
function fmtSec(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`:`${m}:${String(sc).padStart(2,'0')}`}
function fmtH(s){return(s/3600).toFixed(1)+'h'}
function mDate(d){const[,m,dd]=d.split('-');return`${parseInt(m)}/${parseInt(dd)}`}
function weekStartDate(){const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d}
function getWeekDates(){const s=weekStartDate();return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d.toISOString().slice(0,10)})}

// ── 공부 세션 ──
window.selectSubject=function(key){selectedSubjectKey=key;renderSubjectPills();}
window.addStudySession=function(){
  if(!selectedSubjectKey)return alert('과목을 먼저 선택해주세요');
  const task=document.getElementById('study-task-input').value.trim()||'공부';
  const sub=getAllSubjects().find(s=>s.key===selectedSubjectKey);
  const sDate=document.getElementById('study-date').value||todayStr();
  studySessions.push({id:Date.now(),subjectKey:selectedSubjectKey,subjectName:sub.name,task,date:sDate,startTs:null,endTs:null,elapsed:0,done:false,active:false});
  document.getElementById('study-task-input').value='';scheduleSave();renderAll();
}
window.startStudy=function(id){
  if(activeStudy)stopStudy(activeStudy);
  const s=studySessions.find(s=>s.id===id);if(!s)return;
  s.startTs=Date.now();s.active=true;activeStudy=id;
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(renderAll,1000);
  renderAll();
}
window.stopStudy=function(id){
  const s=studySessions.find(s=>s.id===id);if(!s||!s.active)return;
  const now=Date.now();
  s.elapsed+=Math.floor((now-s.startTs));
  timerSessions.push({id:Date.now(),subjectKey:s.subjectKey,startTs:s.startTs,endTs:now,elapsed:Math.floor((now-s.startTs)/1000),date:todayStr()});
  s.active=false;s.startTs=null;activeStudy=null;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  scheduleSave();renderAll();
}
window.toggleStudyDone=function(id){studySessions=studySessions.map(s=>s.id===id?{...s,done:!s.done}:s);scheduleSave();renderAll();}
window.delStudySession=function(id){if(activeStudy===id)window.stopStudy(id);studySessions=studySessions.filter(s=>s.id!==id);scheduleSave();renderAll();}
function studyElapsed(s){let e=s.elapsed;if(s.active&&s.startTs)e+=Date.now()-s.startTs;return Math.floor(e/1000);}
function studyPct(){const t=studySessions.filter(s=>s.date===todayStr());return t.length?Math.round(t.filter(s=>s.done).length/t.length*100):0;}

    let week='',date='',no=0,title='',prof='',hrs=1,manager='';
    if(parts.length>=6){
      if(/^\d+$/.test(parts[0])&&parseInt(parts[0])<=100){week='';date=parts[0];no=parseInt(parts[1])||lectures.length+1;title=parts[2];prof=parts[3];hrs=parseInt(parts[4])||1;if(hasManager)manager=parts[5]||'';}
      else{week=parts[0];date=parts[1];no=parseInt(parts[2])||lectures.length+1;title=parts[3];prof=parts[4];hrs=parseInt(parts[5])||1;if(hasManager&&parts[6])manager=parts[6];}
    }else if(parts.length>=4){week='';date=parts[0];no=parseInt(parts[1])||lectures.length+1;title=parts[2];prof=parts[3];hrs=parseInt(parts[4])||1;}
    if(title)lectures.push({week,date,no,title,prof,hrs,manager});
  });}
  extraSubjects.push({key,name,examDate,hasManager,lectures});
  scheduleSave();closeAddSubjectModal();
  document.getElementById('new-subject-name').value='';document.getElementById('new-subject-data').value='';
  currentCheckTab=key;go('check');
}

// ── 타임라인 ──
function renderTimeline(){
  const hours=[];for(let h=5;h<=24;h++)hours.push(h);for(let h=1;h<=4;h++)hours.push(h);
  const todayTs=timerSessions.filter(s=>s.date===todayStr());
  const activeSession=activeStudy?studySessions.find(s=>s.id===activeStudy):null;
  const allSubs=getAllSubjects();
  let rows='';
  hours.forEach(h=>{
    const hStr=String(h===24?0:h).padStart(2,'0');
    // total blocks
    let totalHtml='';
    todayTs.forEach(s=>{
      const sh=new Date(s.startTs).getHours(),eh=new Date(s.endTs).getHours();
      const sm2=new Date(s.startTs).getMinutes()+new Date(s.startTs).getSeconds()/60;
      const em2=new Date(s.endTs).getMinutes()+new Date(s.endTs).getSeconds()/60;
      if(sh!==h&&eh!==h&&!(sh<h&&eh>h))return;
      const sub=allSubs.find(sb=>sb.key===s.subjectKey);
      const color=sub?sub.color:'#888';
      const left=sh===h?sm2/60*100:0;
      const right=eh===h?em2/60*100:100;
      const w=Math.max(right-left,1);
      totalHtml+=`<div class="tl-block" style="left:${left.toFixed(1)}%;width:${w.toFixed(1)}%;background:${color}" title="${sub?sub.name:''}"></div>`;
    });
    // target (active)
    let targetHtml='';
    if(activeSession&&new Date().getHours()===h){
      const sm3=new Date(activeSession.startTs);
      const startH=sm3.getHours();
      const left=startH===h?(sm3.getMinutes()+sm3.getSeconds()/60)/60*100:0;
      const now=new Date();
      const right=(now.getMinutes()+now.getSeconds()/60)/60*100;
      const w=Math.max(right-left,1);
      const sub=allSubs.find(sb=>sb.key===activeSession.subjectKey);
      const color=sub?sub.color:'#888';
      targetHtml=`<div class="tl-block" style="left:${left.toFixed(1)}%;width:${w.toFixed(1)}%;background:${color};opacity:0.45;border:1.5px dashed ${color}"></div>`;
    }
    rows+=`<div class="tl-row"><div class="tl-label">${hStr}</div><div class="tl-area">${targetHtml}</div><div class="tl-divider-cell"></div><div class="tl-area">${totalHtml}</div></div>`;
  });
  document.getElementById('timeline-wrap').innerHTML=`
    <div class="tl-header-row"><div></div><div class="tl-header-cell">Target</div><div></div><div class="tl-header-cell">Total</div></div>${rows}`;
}

window.switchCheckTab=function(key){
  currentCheckTab=key;
  document.querySelectorAll('.stab').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.stab').forEach(el=>{if(el.dataset.key===key)el.classList.add('active');});
  window.renderCheckTable();
}
window.deleteSubject=function(key){
  const sub=getAllSubjects().find(s=>s.key===key);
  if(!sub)return;
  if(!confirm('"'+sub.name+'" 과목을 삭제할까요?\n추가한 과목만 삭제 가능합니다.'))return;
  extraSubjects=extraSubjects.filter(s=>s.key!==key);
  if(checkData[key])delete checkData[key];
  if(currentCheckTab===key){
    const rem=getAllSubjects();
    currentCheckTab=rem.length?rem[0].key:null;
  }
  scheduleSave();renderCheckTabs();window.renderCheckTable();
}
function renderCheckTabs(){
  const allSubs=getAllSubjects();
  const baseKeys=BASE_SUBJECTS.map(s=>s.key);
  if(!currentCheckTab)currentCheckTab=allSubs[0]?.key;
  document.getElementById('check-tabs').innerHTML=allSubs.map(s=>{
    const isBase=baseKeys.includes(s.key);
    const delBtn=isBase?'':`<span onclick="event.stopPropagation();deleteSubject('${s.key}')" style="margin-left:4px;opacity:0.7;font-size:14px;cursor:pointer" title="삭제">×</span>`;
    return`<div class="stab ${currentCheckTab===s.key?'active':''}" data-key="${s.key}" onclick="switchCheckTab('${s.key}')" style="display:inline-flex;align-items:center">${s.name}${delBtn}</div>`;
  }).join('');
}
window.renderCheckTable=function(){
  const allSubs=getAllSubjects(),sd=allSubs.find(s=>s.key===currentCheckTab);
  if(!sd){document.getElementById('check-table').innerHTML='<div class="empty">과목을 선택해주세요</div>';return;}
  const rows=sd.lectures||[],key=sd.key;
  const total=rows.length,done2=rows.filter(r=>getCell(key,r.no).study!=='').length,pct=total?Math.round(done2/total*100):0;
  document.getElementById('check-progress').innerHTML=`<div class="prog-mini-wrap"><div class="prog-mini-bar"><div class="prog-mini-fill" style="width:${pct}%"></div></div><div class="prog-mini-txt">학습완료 ${done2}/${total} (${pct}%)</div></div>`;
  const hasM=sd.hasManager;
  const th=`<tr><th>주차</th><th>날짜</th><th>번호</th><th style="text-align:left;min-width:160px">강의명</th><th>교수</th><th>시수</th>${hasM?'<th>정리담당</th>':''}<th>학습여부</th><th>제트정리</th><th>정리본</th><th>족보중요<br><span style="font-size:9px;font-weight:400">(O+난이도)</span></th><th>암기확인</th><th>최종점검</th></tr>`;
  const tbody=rows.map(r=>{
    const c=getCell(key,r.no);
    const studyBtns=['강의록','필스','필스제트'].map(v=>`<button class="sbtn ${c.study===v?'sel-'+v:''}" onclick="toggleStudyCheck('${key}',${r.no},'${v}')">${v}</button>`).join('');
    const diffBtns=['상','중','하'].map(v=>`<button class="diff-btn ${c.jbDiff===v?'sel-'+v:''}" onclick="toggleJbDiff('${key}',${r.no},'${v}')">${v}</button>`).join('');
    const jbCell=`<div class="jb-cell"><button class="ox-btn ${c.jb?'o':''}" onclick="toggleOX('${key}',${r.no},'jb')">${c.jb?'O':'—'}</button>${c.jb?`<div style="display:flex;gap:2px">${diffBtns}</div>`:''}</div>`;
    return`<tr class="${r.imp?'imp':''}"><td class="week-cell">${r.week}</td><td class="week-cell">${r.date}</td><td style="color:var(--text3);font-size:11px;font-family:'DM Mono',monospace">${r.no}</td><td class="title-cell">${r.title}</td><td style="white-space:nowrap;font-size:12px">${r.prof}</td><td style="font-size:12px">${r.hrs}</td>${hasM?`<td><span style="font-size:10px;background:var(--surface2);padding:2px 7px;border-radius:999px;color:var(--text2)">${r.manager||''}</span></td>`:''}<td><div class="study-btn-group">${studyBtns}</div></td><td><button class="ox-btn ${c.jet?'o':''}" onclick="toggleOX('${key}',${r.no},'jet')">${c.jet?'O':'—'}</button></td><td><button class="ox-btn ${c.note?'o':''}" onclick="toggleOX('${key}',${r.no},'note')">${c.note?'O':'—'}</button></td><td>${jbCell}</td><td><button class="ox-btn ${c.memo?'o':''}" onclick="toggleOX('${key}',${r.no},'memo')">${c.memo?'O':'—'}</button></td><td><button class="ox-btn ${c.final?'o':''}" onclick="toggleOX('${key}',${r.no},'final')">${c.final?'O':'—'}</button></td></tr>`;
  }).join('');
  document.getElementById('check-table').innerHTML=`<div class="lecture-table-wrap"><table class="lt"><thead>${th}</thead><tbody>${tbody}</tbody></table></div>`;
}

// ── renderAll ──
function renderAll(){
  renderDday();renderWeeklyStats();renderWeekGrid();renderSubjectPills();
  renderStudySessions();renderSubjectTimers();renderTimeline();renderTodos();
  renderCalendar();renderStats();
  if(currentTab==='check'){renderCheckTabs();window.renderCheckTable();}
}

document.getElementById('todo-date').value=todayStr();
document.getElementById('study-date').value=todayStr();
renderAll();
</script>
