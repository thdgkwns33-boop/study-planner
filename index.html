<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="하준봇">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<title>하준봇</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#1B2437; --ink2:#5A6478; --line:#D8DDE6;
  --kakao:#FEE500; --kakao-ink:#191600; --chat:#B9CDE0;
  --go:#1F8A5B; --go-bg:#E3F4EC; --vote:#B7791F; --vote-bg:#FFF4D6; --skip:#8A93A5; --skip-bg:#EDEFF3; --alert:#C8372D; --alert-bg:#FDECEA;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#12161F; --sheet:#1B2130; --ink:#E8ECF3; --ink2:#9AA4B8; --line:#2C3446; --chat:#2A3850;
  --go-bg:#16352A; --vote-bg:#3A2F14; --skip-bg:#252C3B; --alert-bg:#3B1C1A; --go:#4CC38A; --vote:#E3A93C; --alert:#F0736A;
}}
:root[data-theme="dark"]{
  --paper:#12161F; --sheet:#1B2130; --ink:#E8ECF3; --ink2:#9AA4B8; --line:#2C3446; --chat:#2A3850;
  --go-bg:#16352A; --vote-bg:#3A2F14; --skip-bg:#252C3B; --alert-bg:#3B1C1A; --go:#4CC38A; --vote:#E3A93C; --alert:#F0736A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:16px}
.datebox{flex:1;text-align:center}
.date{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.dow{font-size:14px;color:var(--ink2)}
.tools{display:flex;justify-content:center;gap:8px;margin:8px 0 18px;font-size:13px}
.tools button,.tools label{border:none;background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;padding:4px}
.tools input[type=date]{position:absolute;opacity:0;width:1px;height:1px}
.beta{display:inline-block;font-size:11px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 6px;vertical-align:3px;margin-left:4px}

/* status strip */
.strip{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:22px}
.strip h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px}
.todo .mk{flex:none;width:18px;height:18px;border-radius:50%;margin-top:3px;border:2px solid var(--line)}
.todo.done .mk{background:var(--go);border-color:var(--go)}
.todo.warn .mk{border-color:var(--alert);background:var(--alert-bg)}
.todo.done span{color:var(--ink2)}

.alert{background:var(--alert-bg);border:1px solid var(--alert);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.alert b{color:var(--alert)}

/* sections */
section{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.sec-h h2{font-size:18px;margin:0;font-weight:700}
.sec-h span{font-size:13px;color:var(--ink2)}
.off{background:var(--sheet);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--ink2)}
.off strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* lecture timeline */
.rail{position:relative;padding-left:26px}
.rail::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:var(--line)}
.lec{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lec::before{content:"";position:absolute;left:-24px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--sheet);border:2px solid var(--skip)}
.lec[data-s="go"]::before{background:var(--go);border-color:var(--go)}
.lec[data-s="vote"]::before{background:var(--vote);border-color:var(--vote)}
.lec[data-s="skip"]::before{background:var(--skip-bg);border-color:var(--skip)}
.lec-meta{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.lec-title{font-size:16px;font-weight:600;margin:2px 0 8px;line-height:1.4}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.badge.go{background:var(--go-bg);color:var(--go)}
.badge.vote{background:var(--vote-bg);color:var(--vote)}
.badge.skip{background:var(--skip-bg);color:var(--skip)}
.badge.wait{background:var(--paper);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.small{padding:4px 10px;font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--ink2)}
.row input[type=time]{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--paper)}
.reset{border:none;background:none;color:var(--ink2);font-size:12.5px;text-decoration:underline;padding:2px;margin-left:auto}

/* kakao bubbles: what goes into the group chat */
.chat{background:var(--chat);border-radius:12px;padding:10px;margin-top:10px}
.chat-lbl{font-size:12px;color:var(--ink2);margin:0 0 6px 2px}
:root:not([data-theme="light"]) .chat-lbl{color:var(--ink2)}
.bubble{display:flex;flex-direction:column;align-items:flex-end;margin-bottom:8px}
.bubble:last-child{margin-bottom:0}
.bubble textarea{width:100%;background:var(--kakao);color:var(--kakao-ink);border:none;border-radius:12px 4px 12px 12px;padding:9px 11px;resize:vertical;line-height:1.5;font-size:14px;min-height:42px;field-sizing:content}
.bubble.poll textarea{background:#fff;color:#1b1b1b;border-radius:10px;font-weight:600}
.bubble .acts{display:flex;gap:10px;margin-top:4px}
.bubble .acts button{border:none;background:none;font-size:12.5px;color:#26344d;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
:root[data-theme="dark"] .bubble .acts button{color:#C9D6EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bubble .acts button{color:#C9D6EA}}
.bubble .acts button.posted{color:var(--go);text-decoration:none;font-weight:600}

/* drive + forms */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px}
.drv-sub{margin:0 0 10px}
.drv-sub:last-child{margin-bottom:0}
.drv-sub h3{font-size:14.5px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.drv-sub ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink2);overflow-wrap:anywhere}
.muted{color:var(--ink2);font-size:13.5px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.field{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.field label{color:var(--ink2)}
.field input,.field textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--paper);width:100%;min-width:0}
.field .pair{display:flex;gap:6px}
.hint{font-size:12.5px;color:var(--ink2);margin:-2px 0 10px 96px}
.erow{display:grid;grid-template-columns:52px 1fr 1fr auto;gap:6px;margin-bottom:12px;align-items:center}
.erow .ep{grid-column:1;grid-row:1}.erow .et{grid-column:2/5;grid-row:1}
.erow .epr{grid-column:1/3;grid-row:2}.erow .en{grid-column:3;grid-row:2}
.erow input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);min-width:0;width:100%}
.erow .reset{margin:0;grid-column:4;grid-row:2}
.field .pair{min-width:0}.field .pair input{flex:1 1 0;width:0}
.panel{margin:4px 0 0 26px}
.panel .chat-lbl{margin-top:10px}.panel .chat-lbl:first-of-type{margin-top:0}
.wait-note{font-size:12.5px;margin:0 0 8px;color:var(--ink2)}
.sent{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--go);font-weight:600;padding:4px 2px}
.sent .reset{margin:0}
.mp3s{background:var(--paper);border-radius:10px;padding:8px 10px;margin:6px 0}
.mp3{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.mp3 span{flex:1;overflow-wrap:anywhere}
.vlen{width:92px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--sheet);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:13px;margin-top:6px}
.roster summary{cursor:pointer;font-weight:600;font-size:14px}
.roster .chip[aria-pressed="false"]{text-decoration:line-through;opacity:.55}
.vmeta{margin-top:12px;display:grid;gap:8px}
.vm{display:flex;gap:8px;align-items:flex-start}.vm>div{flex:1;display:grid;gap:4px;min-width:0}
.vm select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--sheet);font-size:13px;width:100%}
.vm input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--paper);font-size:13px;width:100%;min-width:0}
.sw{width:14px;height:14px;border-radius:4px;flex:none;margin-top:18px;border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.asg{border-collapse:collapse;font-size:12.5px;white-space:nowrap;color:#111;background:#fff}
table.asg th,table.asg td{border:1px solid #bbb;padding:4px 7px}
table.asg th{background:#F2F2F2;font-weight:600}
table.asg th.dl{background:#FFFF00;font-size:13.5px}
table.asg td.t{text-align:center;font-variant-numeric:tabular-nums}
table.asg td.nm{text-align:center;cursor:pointer}
table.asg td.nm.sel{outline:2px solid #1B2437;outline-offset:-2px}
/* 허브 */
.view[hidden]{display:none!important}
.hub{max-width:560px;margin:0 auto;padding:40px 18px 60px}
.hub-date{color:var(--ink2);margin:0;font-size:14px}
.hub-title{font-family:"Gowun Batang",Georgia,serif;font-size:34px;margin:2px 0 26px;letter-spacing:-.01em}
.door{display:flex;align-items:center;gap:16px;background:var(--sheet);border:1px solid var(--line);border-left:6px solid var(--k);border-radius:16px;padding:20px 18px;margin-bottom:14px;color:var(--ink);text-decoration:none}
.door-ic{font-size:30px;line-height:1}
.door-tx{display:flex;flex-direction:column}
.door-tx b{font-size:19px}
.door-tx small{color:var(--ink2);font-size:13.5px;margin-top:2px}
.door.off{opacity:.55}
.back{display:inline-block;color:var(--ink2);text-decoration:none;font-size:14px;margin-bottom:10px;padding:4px 0}
/* 학습기록지 */
.sv{max-width:600px;margin:0 auto;padding:18px 16px 70px}
.sv-h1{font-family:"Gowun Batang",Georgia,serif;font-size:28px;margin:0}
.sv-today{color:var(--ink2);font-size:14px;margin:2px 0 14px}
.sv-exams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sv-exam{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sv-exam{padding:10px 10px}.sv-exam .d{font-family:"Gowun Batang",Georgia,serif;font-size:24px;line-height:1.15}
.sv-exam .n,.sv-exam .p{font-size:12.5px;color:var(--ink2)}
.sv-tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.sv-tabs button{flex:1;border:none;background:none;border-radius:9px;padding:8px 0;font-weight:500;color:var(--ink2)}
.sv-tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.sv-stamp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin-bottom:12px;flex-wrap:wrap}
.sv-chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px;min-height:32px}
.sv-chip[aria-pressed="true"],.sv-date.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sv-date{padding:3px 10px;max-width:150px}
.sv h2{font-size:15px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sv h2 span{font-weight:400;font-size:13px;color:var(--ink2)}
.sv-task{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sv-task.late{border-color:var(--alert);background:var(--alert-bg)}
.sv-task .st{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;background:transparent}
.sv-task .b{flex:1;min-width:0}.sv-task .t{font-weight:500;line-height:1.35}
.sv-task .m{font-size:12.5px;color:var(--ink2)}.sv-task .m b{color:var(--alert);font-weight:600}
.sv-task .aside{border:none;background:none;font-size:12.5px;color:var(--ink2);text-decoration:underline;flex:none}
.sv-empty{background:var(--sheet);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--ink2);font-size:14px}
.sv-subj{display:flex;gap:6px;margin-bottom:10px}
.sv-subj button{flex:1;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 0;font-weight:600}
.sv-subj button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sv-tw{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
table.sv-t{border-collapse:collapse;width:100%;font-size:13px}
.sv-t th,.sv-t td{border:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:middle}
.sv-t thead th{background:var(--paper);font-weight:600;font-size:11px;white-space:nowrap;padding:6px 2px;line-height:1.25;position:sticky;top:0}
.sv-t td.l{text-align:left;padding:6px 6px;min-width:88px;line-height:1.3;font-size:12.5px}
.sv-t td.l small{display:block;color:var(--ink2);font-size:11.5px}
.sv-t tr.fut td{color:var(--ink2)}
.sv-t td.c{padding:0;width:11%;min-width:40px}
.sv-t th.opt,.sv-t td.opt{background:var(--paper)}
.sv-t td.c button{width:100%;min-height:44px;border:none;background:none;font-size:12px;line-height:1.2;padding:2px}
.sv-t td.c button.done{font-weight:700}
.sv-t td.c button.late{color:var(--alert);font-weight:600}
.sv-t td.c button.wait{color:var(--ink2)}
.sv-t tr.dsep td{background:var(--paper);font-size:12px;color:var(--ink2);text-align:left;padding:4px 8px;font-weight:600}
.sv-day{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sv-day h4{margin:0 0 6px;font-family:"Gowun Batang",Georgia,serif;font-size:17px}
.sv-day ul{margin:0;padding:0;list-style:none}.sv-day li{font-size:14px;padding:2px 0}
.sv-day li i{font-style:normal;font-weight:700;margin-right:6px}
.sv-memos{display:grid;gap:6px;margin-top:8px}
.sv-memos label{display:grid;gap:2px;font-size:12.5px;color:var(--ink2)}
.sv-memos input,.memo-cell input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);font-size:13px;width:100%}
.sv-t td.memo-cell{padding:4px 6px;text-align:left}
.sv-foot{margin-top:30px;font-size:12px;color:var(--ink2);text-align:center}
.lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
.lock[hidden]{display:none}
.lock-box{width:100%;max-width:300px;text-align:center}
.lock-title{font-family:"Gowun Batang",Georgia,serif;font-size:30px;margin-bottom:22px}
.lock-dots{display:flex;justify-content:center;gap:16px;margin-bottom:10px}
.lock-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.lock-dots i.on{background:var(--ink)}
.lock-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.lock-dots.shake{animation:none}}
.lock-msg{font-size:13.5px;color:var(--ink2);min-height:20px;margin-bottom:18px}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lock-pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);font-size:24px;font-weight:500;aspect-ratio:1;justify-self:center;width:64px}
.lock-pad button.fn{border:none;background:none;font-size:15px;color:var(--ink2)}
.hub-foot{max-width:560px;margin:-40px auto 40px;padding:0 18px;font-size:12.5px;color:var(--ink2);text-align:center}
.linkish{border:none;background:none;color:var(--ink2);text-decoration:underline;font-size:12.5px;cursor:pointer;padding:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{font-size:12px;color:var(--ink2);text-align:center;margin-top:30px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="lock" class="lock" role="dialog" aria-modal="true" aria-label="비밀번호 입력">
  <div class="lock-box">
    <div class="lock-title">하준봇</div>
    <div class="lock-dots" id="lockDots" aria-live="polite"><i></i><i></i><i></i><i></i></div>
    <div class="lock-msg" id="lockMsg">비밀번호 4자리</div>
    <div class="lock-pad"></div>
  </div>
</div>
<div id="login" class="lock" hidden style="z-index:99">
  <div class="lock-box">
    <div class="lock-title">하준봇</div>
    <p class="lock-msg" id="loginMsg">구글 계정으로 로그인하면 기록이 모든 기기에 동기화되고, 드라이브 폴더도 확인할 수 있어요.</p>
    <button class="btn" id="loginBtn" style="width:100%;padding:12px">구글로 로그인</button>
  </div>
</div>
<div id="hubView" class="view">
  <div class="hub">
    <p class="hub-date" id="hubDate"></p>

    if(d==="ai"){ const profs=[...new Set(g.map(x=>x.l.prof).filter(Boolean))]; lines.push(`${P} ${profs.length===1?profs[0]+" 교수님 파트 ":""}AI 강의록 사용으로 필스 진행합니다.`); } }
  const v=items.filter(x=>x.dec==="vote");
  if(v.length){ if(lines.length) lines.push(""); lines.push(`${pRange(v.map(x=>x.l.p))} 10% 이내 변동으로 투표합니다. ${dl}까지 받겠습니다.`); }
  return lines.join("\n");
}
function resText(items){ const lines=[]; const o=items.filter(x=>x.r==="O"), x=items.filter(x=>x.r==="X");
  if(o.length) lines.push(`${pRange(o.map(i=>i.l.p))} 투표 결과 필스 진행합니다.`);
  if(x.length) lines.push(`${pRange(x.map(i=>i.l.p))} 투표 결과 필스 진행하지 않습니다.`); return lines.join("\n"); }
/* 아직 안 올린 것만 모으기 (올린 건 강의 단위로 기억) */
function blockPending(block,lecs){
  const B=blk(block); const ann=[],poll=[],res=[]; let any={ann:0,poll:0,res:0};
  for(const l of lecs){ const key=block+l.p, r=st.lectures[key]; if(!r||!r.dec||r.dec==="none") continue;
    any.ann++; if(!B.posted.ann.includes(key+":"+r.dec)) ann.push({l,dec:r.dec,k:key+":"+r.dec});
    if(r.dec==="vote"){ any.poll++; if(!B.posted.poll.includes(key)) poll.push({l,k:key});
      if(r.result){ any.res++; if(!B.posted.res.includes(key+":"+r.result)) res.push({l,r:r.result,k:key+":"+r.result}); } } }
  return {ann,poll,res,any};
}
function pollPostedFor(block,l){ return blk(block).posted.poll.includes(block+l.p); }

function renderLec(block,lec){
  const key=block+lec.p; const r=st.lectures[key]||{};
  let html=`<div class="lec" data-s="${lecState(r)}" data-key="${key}">
    <div class="lec-meta"><span>${pLabel(lec.p)} ${PSTART[lec.p.split("-")[0]]||""}${lec.note?" · "+esc(lec.note):""}</span>${badgeFor(r,block)}</div>
    <div class="lec-title">${esc(lec.t)}${lec.prof?` <span class="muted">/ ${esc(lec.prof)}P</span>`:""}</div>`;
  if(!r.dec){
    html+=`<div class="chips" role="group" aria-label="합본부원 판정">${Object.entries(DEC).map(([k,v])=>`<button class="chip" data-dec="${k}" aria-pressed="false">${v.label}</button>`).join("")}</div>`;
  } else {
    html+=`<div class="chips"><span class="chip small" aria-pressed="true">${DEC[r.dec].label}</span><button class="reset" data-undo="1">판정 다시 하기</button></div>`;
    if(r.dec==="vote" && pollPostedFor(block,lec)){
      html+=`<div class="row">투표 결과 <button class="chip small" data-res="O" aria-pressed="${r.result==="O"}">필스 O</button><button class="chip small" data-res="X" aria-pressed="${r.result==="X"}">필스 X</button></div>`;
    }
  }
  return html+`</div>`;
}

function outBox(block,kind,items,count,text,{poll=false,title}){
  const B=blk(block);
  if(!count) return "";
  if(!items.length) return `<div class="sent"><span>✓ ${title} 올림</span><button class="reset" data-unpost="${block}:${kind}">되돌리기</button></div>`;
  const ed=B.edits[kind]; const shown=(ed&&ed.base===text)?ed.text:text;
  const more=items.length<count?` <span class="muted">(새로 추가된 것만)</span>`:"";
  return `<p class="chat-lbl">${title}${more}</p><div class="bubble${poll?" poll":""}">
    <textarea data-bedit="${block}:${kind}" data-base="${esc(text)}" data-keys="${esc(JSON.stringify(items.map(i=>i.k)))}" rows="${text.split("\n").length}" aria-label="${title}">${esc(shown)}</textarea>
    <div class="acts"><button data-copy="1">복사</button><button data-bpost="${block}:${kind}">단톡에 올렸어요</button></div></div>`;
}
function renderPanel(block,lecs){
  const info=dayInfo(cur); const P=blockPending(block,lecs); const dl=dayDeadline(info);
  const undecided=lecs.filter(l=>!(st.lectures[block+l.p]||{}).dec).length;
  if(!P.any.ann) return `<p class="muted" style="margin:4px 0 0 26px">판정을 누르면 여기에 한 번에 올릴 공지가 모여요.</p>`;
  let h=`<div class="chat panel">`;
  if(undecided) h+=`<p class="wait-note">아직 판정 안 한 강의 ${undecided}개 · 먼저 올려도 나중 것만 따로 모아줘요</p>`;
  if(P.any.poll) h+=`<div class="row" style="margin:0 0 8px;color:inherit">투표 마감 <input type="time" value="${dl}" data-vdl="1" aria-label="투표 마감 시각"><span class="muted">${st.voteDl?`<button class="reset" data-vdlreset="1" style="margin:0">자동(${autoDeadline(info)})으로</button>`:"마지막 수업 끝 + 30분"}</span></div>`;
  h+=outBox(block,"ann",P.ann,P.any.ann,annText(P.ann,dl),{title:"공지 한 번"});
  h+=outBox(block,"poll",P.poll,P.any.poll,P.poll.map(x=>pollTitle(x.l)).join("\n"),{poll:true,title:`투표 한 번 (질문 ${P.poll.length||P.any.poll}개)`});
  h+=outBox(block,"res",P.res,P.any.res,resText(P.res),{title:"투표 결과"});
  return h+`</div>`;
}

function dayInfo(d){
  if(d===cur && st && st.tt) return {tt:st.tt, edited:true};
  if(OFF[d]) return {off:OFF[d]};
  const w=dow(d);
  if(w===0||w===6) return {off:"주말"};
  if(w===3) return {off:"수요일은 실습·의료인문학이라"};
  if(d<BLOCK[0]||d>BLOCK[1]) return {off:"시간표 범위 밖", outside:true};
  if(d===cur && st && st.tt) return {tt:st.tt, edited:true};
  if(TT[d]) return {tt:TT[d]};
  return {off:"이론 강의가 없는 날"};
}

function wireEditor(){

  const blankRow=()=>{ const d=document.createElement("div"); d.innerHTML=renderEditor(block,["",[{p:"",t:"",prof:"",note:""}]],"").match(/<div class="erow">[\s\S]*?<\/div>/)[0]; return d.firstElementChild; };

function allLecs(info){ const out=[]; if(!info.tt) return out; for(const b of ["am","pm"]) if(info.tt[b]) for(const l of info.tt[b][1]) out.push([b,l]); return out; }

function renderStrip(info){
  const s=$("strip"); const items=[];
  if(info.tt){
    const lecs=allLecs(info);
    const undecided=lecs.filter(([b,l])=>!(st.lectures[b+l.p]||{}).dec).length;
    let annP=0,pollP=0,resP=0,open=0,late=0; const now=kstNowHM(), isToday=cur===kstToday(); const dl=dayDeadline(info);
    for(const b of ["am","pm"]){ if(!info.tt[b]) continue; const ls=info.tt[b][1]; const P=blockPending(b,ls);
      annP+=P.ann.length; pollP+=P.poll.length; resP+=P.res.length;
      const ov=ls.filter(l=>{const r=st.lectures[b+l.p]; return r&&r.dec==="vote"&&!r.result&&pollPostedFor(b,l);}).length;
      open+=ov; if(ov&&isToday&&dl<=now) late+=ov; }
    items.push([undecided===0?"done":"", undecided===0?`${lecs.length}강 판정 완료`:`판정 대기 ${undecided}강 (합본부원 톡 확인)`]);
    if(annP) items.push(["warn",`공지 안 올린 판정 ${annP}강`]);
    if(pollP) items.push(["warn",`안 올린 투표 질문 ${pollP}개`]);
    if(open) items.push([late?"warn":"",`진행 중인 투표 ${open}개${late?" · 마감 지남, 결과 누르기":""}`]);
    if(resP) items.push(["warn",`투표 결과 ${resP}강 공지하기`]);
    const goCount=lecs.filter(([b,l])=>lecState(st.lectures[b+l.p])==="go").length;
    const allSettled=lecs.every(([b,l])=>{const x=lecState(st.lectures[b+l.p]); return x==="go"||x==="skip";});
    if(st.notice&&st.notice.posted) items.push(["done","분담 공지 올림"]);
    else if(allSettled && goCount>0) items.push(["warn",`필스 ${goCount}강 확정 → 녹화 자료 올라오면 분담 공지`]);
    else if(allSettled && goCount===0) items.push(["done","오늘은 필스할 강의 없음"]);
    else items.push(["","분담 공지 (판정·투표 끝나면)"]);
  }
  if(!items.length){ s.style.display="none"; return; }
  s.style.display="";
  s.innerHTML=`<h2>오늘 할 일</h2>`+items.map(([c,t])=>`<div class="todo ${c}"><span class="mk" aria-hidden="true"></span><span>${esc(t)}</span></div>`).join("");
}

function nextDeadline(d){ const nd=addDays(d,1); return {date:nd, time: dow(d)===5?"12:00":"23:00"}; }
function secsToKor(s){ s=Math.round(s); const m=Math.floor(s/60), r=s%60; return (m?m+"분 ":"")+r+"초"; }
function hmsToSec(v){ const p=v.trim().split(":").map(Number); if(p.some(isNaN)) return null; return p.reduce((a,b)=>a*60+b,0); }
function noticeText(n){
  const lines=[`[${mmdd(cur)}(${DOW[dow(cur)]}) 필스 공지]`,`- 총원 : ${n.total}`,`- 분량 : ${n.amount}`,
    `- 마감 : ${md(n.deadlineDate)} (${DOW[dow(n.deadlineDate)]}) ${korTime(n.deadlineTime)}까지`,
    `- 강조하신 부분은 별표, 볼드체, 강조하셨습니다 등등 표시 부탁드립니다.`,
    `- 저장할 파일명 뒤에 "-이름"을 붙여서 제출해 주세요.`];
  if(n.extra&&n.extra.trim()) n.extra.trim().split("\n").forEach(x=>lines.push("- "+x.replace(/^-\s*/,"")));
  return lines.join("\n");
}

  const skOf=arr=>arr.filter(x=>x[0].sk), notSk=arr=>arr.filter(x=>!x[0].sk);
  const groupRows=(arr,isLate)=>{ const g={}; for(const [l,st,note] of arr){ const key=l.date+"|"+st.k; (g[key]=g[key]||{l,st,note,skills:[]}).skills.push(l.t); }
    return Object.values(g).map(x=>`<div class="sv-task${isLate?" late":""}"><button class="st" data-svgroup="${x.l.date}|${x.st.k}" aria-label="${slashMD(x.l.date)} 과정기술 ${x.st.label} 모두 완료">${x.st.n}</button><div class="b"><div class="t">과정기술 ${slashMD(x.l.date)}${x.l.r2?" 2회차":""} ${x.st.label}</div><div class="m">${esc(x.skills.join(" · "))}${isLate?` · ${x.note}`:""}</div>${x.st.memo?svMemoInputs(x.l.date):""}</div></div>`).join(""); };
  const skNext=skOf(next), skLate=skOf(late); next=notSk(next); late=notSk(late);
  const sec=(title,items,empty)=>{ h+=`<h2>${title}<span>${items.length}개</span></h2>`+(items.length?items.map(svTaskHtml).join(""):`<div class="sv-empty">${empty}</div>`); };
  h=`<p class="muted" style="font-size:12.5px;margin:0 2px 6px">${SV_LOADING?"정리스터디 폴더 확인 중…":SV_NEEDAUTH?`<button class="reset" data-svauth="1" style="margin:0">정리스터디 확인하려면 눌러서 구글 드라이브 연결</button>`:SV_F&&SV_F.at?`정리스터디 폴더 ${SV_F.at} 확인`:""}</p>`+h;
  sec("오늘 수업 1~3",today,L.some(l=>l.date===T&&!l.sk)?"오늘 수업 할 일을 모두 끝냈어요":"오늘은 기말 범위 수업이 없어요");
  sec("다음 날 복습",next,skNext.length?"":"오늘 챙길 복습이 없어요");
  if(skNext.length) h+=groupRows(skNext,false);
  if(prep.length){ const byD={}; prep.forEach(([l,st])=>{ (byD[l.date]=byD[l.date]||{skills:new Set(),steps:{}}); byD[l.date].skills.add(l.t); byD[l.date].steps[st.k]=st; });
    h+=`<h2>과정기술 실습 준비<span>${Object.keys(byD).length}회차</span></h2>`+Object.entries(byD).map(([d,v])=>{
      const all=svLectures().filter(l=>l.sk&&l.date===d);
      const btn=st=>{ const done=all.every(l=>(SVP[svKey(l)]||{})[st.k]); return `<button class="sv-chip" data-svgroup="${d}|${st.k}" aria-pressed="${done}">${done?"✓ ":""}${st.label}</button>`; };
      const r2=all.some(l=>l.r2); const pre=(r2?SK2_STEPS:SK_STEPS).filter(st=>SK_PRE.has(st.k));
      return `<div class="sv-task" style="display:block"><div class="t">${slashMD(d)} ${r2?"2회차 (우리끼리) ":""}실습 전까지</div><div class="m" style="margin:2px 0 8px">${esc([...all.map(l=>l.t)].join(" · "))}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${pre.map(btn).join("")}</div></div>`; }).join(""); }
  if(late.length||skLate.length){ h+=`<h2>밀린 것<span>${late.length+skLate.length}개</span></h2>`+late.sort((a,b)=>a[0].date.localeCompare(b[0].date)).map(svTaskHtml).join("")+groupRows(skLate,true); }
  if(wait.length){ h+=`<h2>자료 기다리는 중<span>${wait.length}개</span></h2>`+wait.map(([l,st,auto])=>`<div class="sv-task"><button class="st" data-svt="${esc(svKey(l))}|${st.k}" aria-label="${esc(svName(l))} ${st.label} 완료">${st.n}</button><div class="b"><div class="t">${esc(svName(l))}</div><div class="m">${st.label} · ${auto?({s1:"대본정리본이 0.워드에 아직 없어요",s3:"정리스터디 파일이 아직 없어요",s4:"예상문항 봇이 아직 안 만들었어요",s5:"알고리즘·2p 요약이 아직 없어요"})[st.k]:slashMD(l.date)+" 수업"}</div></div>${auto?"":`<button class="aside" data-svunwait="${esc(svKey(l))}|${st.k}">나왔어요</button>`}</div>`).join(""); }
  const up=L.filter(l=>l.date>T&&!l.sk); if(up.length){ const nd=up[0].date; h+=`<h2>다음 수업<span>${slashMD(nd)}</span></h2><div class="sv-empty" style="text-align:left">${up.filter(l=>l.date===nd).map(l=>esc(svName(l))).join("<br>")}</div>`; }
  $("svView").innerHTML=h;
}
function svMemoInputs(d){ return `<div class="sv-memos">${svLectures().filter(l=>l.sk&&l.date===d).map(l=>`<label><span>${esc(l.t)}</span><input data-svmemo="${esc(svKey(l))}" value="${esc((SVP[svKey(l)]||{}).memo||"")}" placeholder="빠뜨린 순서·실수 (없으면 비워두기)"></label>`).join("")}</div>`; }
function svDrawBoard(){
  const T=svToday(); const ls=svLectures().filter(l=>l.subj===svSubj); const STP=svSubj==="과정기술"?SK_STEPS:SV_STEPS; const isSk=svSubj==="과정기술";
  let h=`<div class="sv-subj" role="group" aria-label="과목">${Object.keys(SV_EXAMS).map(s=>`<button data-svsubj="${esc(s)}" aria-pressed="${s===svSubj}">${esc(SV_SHORT[s])}</button>`).join("")}</div>`;
  if(!isSk){ const tot=ls.reduce((a,l)=>a+svHours(l),0), done=ls.filter(l=>SV_REQ().every(st=>(SVP[svKey(l)]||{})[st.k])).reduce((a,l)=>a+svHours(l),0);
    h+=`<p class="muted" style="font-size:13px;margin:0 2px 8px">기말 범위 ${ls.length}강 · 총 ${tot}시수 · 5단계 끝낸 ${done}시수</p>`; }
  const groups=isSk?[["1회차 실습",ls.filter(l=>!l.r2),SK_STEPS],["2회차 · 우리끼리 반복",ls.filter(l=>l.r2),SK2_STEPS]]:[[null,ls,STP]];
  for(const [gTitle,gls,GSTP] of groups){ h+=svBoardTable(gTitle,gls,GSTP,isSk,T); }
  h+=`<p class="muted" style="font-size:12.5px;margin:8px 2px 0">${isSk?"준비 단계는 실습 주에 할 일로 떠요. 1회차 9/16·9/23 복습은 패스. 2회차는 순서 암기 확인과 빠뜨린 것 기록만 해요.":"예습은 선택이라 밀림·할 일에 안 들어가요."} 칸을 누르면 고른 날짜로 체크, 한 번 더 누르면 지워져요</p>`;
  $("svView").innerHTML=h;
}
function svBoardTable(gTitle,ls,STP,isSk,T){
  let h=gTitle?`<h2 style="margin-top:14px">${gTitle}<span>${ls.length}개</span></h2>`:"";
  h+=`<div class="sv-tw"><table class="sv-t"><thead><tr><th>${isSk?"술기":"강의"}</th>${STP.map(st=>`<th${st.optional?' class="opt"':""}>${esc(st.short).replace("\n","<br>")}</th>`).join("")}</tr></thead><tbody>`;
  let lastD="";
  for(const l of ls){ if(l.date!==lastD){ h+=`<tr class="dsep"><td colspan="${STP.length+1}">${slashMD(l.date)}</td></tr>`; lastD=l.date; }
    const r=SVP[svKey(l)]||{}; const fut=l.date>T;
    h+=`<tr class="${fut&&!isSk?"fut":""}"><td class="l">${esc(l.t)}${(l.prof||svHours(l))?`<small>${[l.prof?esc(l.prof)+"P":"",svHours(l)?svHours(l)+"시수":""].filter(Boolean).join(" · ")}</small>`:""}</td>`+STP.map(st=>{
      const v=r[st.k]; let cls="", txt="";
      if(v){ cls="done"; txt="✓<br>"+slashMD(v).replace(/\(.\)/,""); }
      else if(st.optional){ txt=""; }
      else if(skPass(l,st.k)){ cls="wait"; txt="패스"; }
      else if(isSk&&SK_PRE.has(st.k)){ txt=(l.date>=T&&svDiff(l.date,T)<=6)?"준비":""; }
      else if(!fut){ if(st.wait&&r["w_"+st.k]&&!svAuto(l,st.k)){ cls="wait"; txt="대기"; } else { const d=svDue(l,st.k); if(d===null){ cls="wait"; txt="대기"; } else if(d<T){ cls="late"; txt="밀림"; } else if(d===T){ txt="오늘"; } } }
      return `<td class="c${st.optional?" opt":""}"><button class="${cls}" data-svt="${esc(svKey(l))}|${st.k}" aria-label="${esc(l.t)} ${st.label}${v?" "+v+" 완료":""}">${txt}</button></td>`; }).join("")+`</tr>`;
    if(l.r2) h+=`<tr><td colspan="${STP.length+1}" class="memo-cell"><input data-svmemo="${esc(svKey(l))}" value="${esc(r.memo||"")}" placeholder="빠뜨린 순서·실수 메모"></td></tr>`; }
  return h+`</tbody></table></div>`;
}
function svDrawLog(){
  const L=svLectures(), by={};
  for(const l of L){ const r=SVP[svKey(l)]||{}; for(const st of stepsFor(l)) if(r[st.k]) (by[r[st.k]]=by[r[st.k]]||[]).push([l,st]); }
  const days=Object.keys(by).sort().reverse();
  $("svView").innerHTML=days.length?days.map(d=>`<div class="sv-day"><h4>${+d.slice(5,7)}월 ${+d.slice(8,10)}일 ${DOW[dow(d)]} <span class="muted" style="font-family:inherit;font-size:12.5px">${by[d].length}개</span></h4><ul>`+by[d].sort((a,b)=>a[1].k.localeCompare(b[1].k)).map(([l,st])=>`<li><i>${st.n}</i>${esc(svName(l))} <span class="muted" style="font-size:12.5px">${st.label}</span>${st.memo&&(SVP[svKey(l)]||{}).memo?`<div class="muted" style="font-size:12.5px;margin-left:20px">✎ ${esc(SVP[svKey(l)].memo)}</div>`:""}</li>`).join("")+`</ul></div>`).join(""):`<div class="sv-empty">아직 기록이 없어요. 체크하면 날짜별로 여기에 쌓여요.</div>`;
}
function svDraw(){ svDrawHeader(); ({todo:svDrawTodo,board:svDrawBoard,log:svDrawLog})[svTab](); }
function svSplit(v){ const i=v.lastIndexOf("|"); return [v.slice(0,i),v.slice(i+1)]; }
function svFind(key){ return svLectures().find(l=>svKey(l)===key); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!b.closest("#planView")) return;
  if(b.dataset.svtab){ svTab=b.dataset.svtab; document.querySelectorAll("[data-svtab]").forEach(x=>x.setAttribute("aria-selected",x===b)); svDraw(); return; }
  if(b.dataset.when!==undefined){ svWhen=+b.dataset.when; svCustom=null; $("svPick").value=""; $("svPick").classList.remove("on"); document.querySelectorAll("[data-when]").forEach(x=>x.setAttribute("aria-pressed",x===b)); return; }
  if(b.dataset.svsubj){ svSubj=b.dataset.svsubj; svDraw(); return; }
  if(b.dataset.svt){ const [key,k]=svSplit(b.dataset.svt); const l=svFind(key); if(!l) return; const r=svRec(l);
    if(r[k]){ delete r[k]; toast("체크를 지웠어요"); } else { r[k]=svStamp(); delete r["w_"+k]; toast(`${slashMD(r[k])} ${(stepsFor(l).find(x=>x.k===k)||{}).label||""} 기록했어요`); }
    svSave(); svDraw(); updateHub(); return; }
  if(b.dataset.svauth){ withDrive(()=>svLoadExams().then(svDraw)); return; }
  if(b.dataset.svgroup){ const [d,k]=svSplit(b.dataset.svgroup); const ls=svLectures().filter(l=>l.sk&&l.date===d); const allDone=ls.every(l=>(SVP[svKey(l)]||{})[k]);
    ls.forEach(l=>{ const r=svRec(l); if(allDone) delete r[k]; else if(!r[k]) r[k]=svStamp(); }); svSave(); svDraw(); updateHub();
    toast(allDone?"체크를 지웠어요":`${slashMD(svStamp())} ${(SK_STEPS.find(x=>x.k===k)||{}).label} 기록했어요`); return; }
  if(b.dataset.svwait){ const [key,k]=svSplit(b.dataset.svwait); const l=svFind(key); if(l){ svRec(l)["w_"+k]=true; svSave(); svDraw(); } return; }
  if(b.dataset.svunwait){ const [key,k]=svSplit(b.dataset.svunwait); const l=svFind(key); if(l){ delete svRec(l)["w_"+k]; svSave(); svDraw(); } return; }
});
document.addEventListener("change",e=>{ const m=e.target.closest&&e.target.closest("[data-svmemo]"); if(!m) return; const l=svFind(m.dataset.svmemo); if(!l) return; const r=svRec(l); const v=m.value.trim(); if(v) r.memo=v; else delete r.memo; svSave(); toast("메모 저장했어요"); });
$("svPick").max=kstToday();
$("svPick").addEventListener("change",e=>{ const v=e.target.value; if(!v){ return; } svCustom=v; e.target.classList.add("on"); document.querySelectorAll("[data-when]").forEach(x=>x.setAttribute("aria-pressed","false")); toast(`${slashMD(v)} 날짜로 기록해요`); });

/* ───────── 홈 · 화면 전환 ───────── */
function updateHub(){
  const T=kstToday(); $("hubDate").textContent=`${+T.slice(5,7)}월 ${+T.slice(8,10)}일 ${DOW[dow(T)]}요일`;
  try{ const {today,next,late}=svTaskList(); const n=today.length+next.length; $("hubPlan").textContent= (n||late.length)?`오늘 할 일 ${n}개${late.length?` · 밀린 것 ${late.length}개`:""}`:"오늘 할 일 없음"; }catch(e){}
  const info=dayInfo(T); $("hubPils").textContent= info.off?"오늘은 필스부 업무 없음":`오늘 ${allLecs(info).length}강 · 판정·투표·분담`;
}
async function route(){
  const h=(location.hash||"").slice(1);
  $("hubView").hidden = !(h===""||h==="home"); $("hubFoot").hidden=$("hubView").hidden; $("planView").hidden = h!=="plan"; $("pilsView").hidden = h!=="pils";
  if(h==="plan"){ await svLoadOverrides(); svDraw(); svLoadExams().then(()=>{ if((location.hash||"").slice(1)==="plan") svDraw(); }); }
  if(h===""||h==="home") updateHub();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ───────── 시작 ───────── */
loadRoster().then(()=>renderAssign(dayInfo(cur)));
render();
svLoad().then(async()=>{ await svLoadOverrides(); route(); });
/* ───────── Firebase · 구글 드라이브 연결 ───────── */
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.metadata.readonly";
const isStandalone=()=>window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
function tokenGet(){ try{ const t=JSON.parse(localStorage.getItem("hjbot:gtoken")||"null"); if(t&&t.exp>Date.now()) return t.v; }catch(e){} return null; }
function tokenSave(v){ try{ localStorage.setItem("hjbot:gtoken",JSON.stringify({v,exp:Date.now()+55*60*1000})); }catch(e){} }
function tokenClear(){ try{ localStorage.removeItem("hjbot:gtoken"); }catch(e){} }
function googleProvider(){ const p=new firebase.auth.GoogleAuthProvider(); p.addScope(DRIVE_SCOPE); if(firebase.auth().currentUser) p.setCustomParameters({login_hint:firebase.auth().currentUser.email}); return p; }
async function googleSignIn(){
  const auth=firebase.auth(), p=googleProvider();
  if(isStandalone()){ sessionStorage.setItem("hjbot:return",location.hash||""); await auth.signInWithRedirect(p); return null; }
  try{ const r=await auth.signInWithPopup(p); if(r.credential&&r.credential.accessToken) tokenSave(r.credential.accessToken); return r; }
  catch(e){ if(e&&/popup/.test(e.code||"")){ sessionStorage.setItem("hjbot:return",location.hash||""); await auth.signInWithRedirect(p); return null; } throw e; }
}
async function withDrive(fn){ if(!tokenGet()){ try{ await googleSignIn(); }catch(e){ toast("구글 연결을 취소했어요"); return; } if(!tokenGet()) return; } return fn(); }
const driveAdapter={ async callTool(_s,_t,input){
  const tok=tokenGet(); if(!tok) throw {code:"needs_reauth"};
  let q=input.query.replace(/parentId = '([^']+)'/g,"'$1' in parents").replace(/\btitle (=|contains) /g,"name $1 ")+" and trashed = false";
  const ps=new URLSearchParams({q,pageSize:"200",includeItemsFromAllDrives:"true",supportsAllDrives:"true",fields:"nextPageToken,files(id,name,mimeType,size,fileExtension,parents,webViewLink,createdTime,videoMediaMetadata)"});
  if(input.pageToken) ps.set("pageToken",input.pageToken);
  const r=await fetch("https://www.googleapis.com/drive/v3/files?"+ps,{headers:{Authorization:"Bearer "+tok}});
  if(r.status===401){ tokenClear(); throw {code:"needs_reauth"}; }
  if(r.status===403) throw {code:"not_in_manifest"};
  if(!r.ok) throw {code:"server_unavailable"};
  const j=await r.json();
  return {payload:{files:(j.files||[]).map(f=>({id:f.id,title:f.name,mimeType:f.mimeType,fileSize:f.size,fileExtension:f.fileExtension,parentId:(f.parents||[])[0],viewUrl:f.webViewLink,createdTime:f.createdTime,durationMs:f.videoMediaMetadata&&f.videoMediaMetadata.durationMillis?+f.videoMediaMetadata.durationMillis:null})),nextPageToken:j.nextPageToken}};
}};
const downloadAdapter={ async save({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data],{type:/\.xlsx$/.test(filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"application/octet-stream"});
  const file=new File([blob],filename,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
}};

/* 기존 claude.ai 기록 가져오기 · 로그아웃 */
function drawHubFoot(){ const u=firebase.auth().currentUser; $("hubFoot").innerHTML=u?`<span>${esc(u.email||"")}</span> · <label class="linkish">기존 기록 가져오기<input type="file" id="importFile" accept="application/json" hidden></label> · <button class="linkish" id="logoutBtn">로그아웃</button>`:"";
  const f=$("importFile"); if(f) f.onchange=async e=>{ const file=e.target.files[0]; if(!file) return; try{ const d=JSON.parse(await file.text()); let n=0;
      for(const [id,v] of Object.entries(d.days||{})){ await db.doc("days/"+id).set(v); n++; }
      for(const [id,v] of Object.entries(d.progress||{})){ await db.doc("progress/"+id).set(v); n++; }
      for(const [id,v] of Object.entries(d.settings||{})){ await db.doc("settings/"+id).set(v); n++; }
      toast(`${n}개 기록을 가져왔어요`); setTimeout(()=>location.reload(),900); }catch(err){ toast("가져오지 못했어요. 파일을 확인해 주세요"); } };
  const lo=$("logoutBtn"); if(lo) lo.onclick=async()=>{ tokenClear(); await firebase.auth().signOut(); location.reload(); }; }

(async()=>{
  if(!window.FIREBASE_CONFIG){ document.body.innerHTML="<p style='padding:24px'>firebase-config.js가 없어요.</p>"; return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth=firebase.auth(), fs=firebase.firestore();
  try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  try{ const r=await auth.getRedirectResult(); if(r&&r.credential&&r.credential.accessToken){ tokenSave(r.credential.accessToken); const back=sessionStorage.getItem("hjbot:return"); if(back){ sessionStorage.removeItem("hjbot:return"); location.hash=back; } } }catch(e){ console.warn(e); }
  $("loginBtn").onclick=async()=>{ try{ await googleSignIn(); }catch(e){ $("loginMsg").textContent="로그인하지 못했어요. 다시 눌러 주세요."; } };
  auth.onAuthStateChanged(async u=>{
    $("login").hidden=!!u; if(!u) return;
    const base=`users/${u.uid}/`;
    db={doc:p=>fs.doc(base+p), collection:p=>fs.collection(base+p)};
    mcp=driveAdapter; downloads=downloadAdapter;
    drawHubFoot(); await loadRoster();
    const local=JSON.stringify(SVP); await svLoad(); if(!Object.keys(SVP).length&&local!=="{}"){ SVP=JSON.parse(local); svSave(); }
    loadedFor=null; st=null; await svLoadOverrides(); route(); render();
    if(tokenGet()) svLoadExams().then(()=>{ const h=(location.hash||"").slice(1); if(h==="plan") svDraw(); });
    else { SV_NEEDAUTH=true; if((location.hash||"")==="#plan") svDraw(); }
  });
})();
</script>
